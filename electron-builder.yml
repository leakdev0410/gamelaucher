appId: com.lequan.gamelaucher
productName: gamelaucher
forceCodeSigning: false
afterPack: scripts/set-win-icon.cjs
directories:
  buildResources: build
extraResources:
  - ludusavi
  - gamelaucher-go-rpc
  - seeds
  - from: node_modules/create-desktop-shortcuts/src/windows.vbs
  - from: resources/achievement.wav
files:
  - "!**/.vscode/*"
  - "!src/*"
  - "!electron.vite.config.{js,ts,mjs,cjs}"
  - "!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}"
  - "!{.env,.env.*,.npmrc,pnpm-lock.yaml}"
  - "!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}"
asarUnpack:
  - resources/**
  - node_modules/sharp/**
  - node_modules/@img/sharp-libvips-*/**
win:
  icon: build/icon.ico
  executableName: gamelaucher
  verifyUpdateCodeSignature: false
  signAndEditExecutable: false
  extraResources:
    - from: binaries/7z.exe
    - from: binaries/7z.dll
  target:
    - nsis
    - portable
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  installerIcon: build/icon.ico
  installerSidebar: build/installerSidebar.bmp
  uninstallerIcon: build/icon.ico
  uninstallerSidebar: build/installerSidebar.bmp
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  oneClick: false
  allowToChangeInstallationDirectory: true
  include: installer.nsh
portable:
  artifactName: ${name}-${version}-portable.${ext}
  splashImage: build/splash.bmp
mac:
  entitlementsInherit: build/entitlements.mac.plist
  extraResources:
    - from: binaries/7zz
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  extraResources:
    - from: binaries/7zzs
    - from: binaries/umu/umu-run
  target:
    - AppImage
    - snap
    - deb
    - rpm
  maintainer: electronjs.org
  category: Game
  mimeTypes:
    - x-scheme-handler/hydralauncher
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
